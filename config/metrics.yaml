# 指标口径定义 — 与 DataPilot / SQLGuard 对接约定
# metric_id 稳定、可被外部系统引用；SQL 见 sql/metrics/
metrics:
  ads_dau_di:
    name: 日活 DAU
    grain: day x server_id
    formula: COUNT(DISTINCT player_id) WHERE event_type = 'login' OR 当日有任意行为事件
    notes: 以当日出现过任意有效事件的 player_id 去重；优先用 login 补全，但不强制仅 login
  ads_retention_nd:
    name: N日留存
    grain: cohort_day x n_days x server_id
    formula: cohort_日新增玩家中，在 day+N 仍有行为的玩家数 / cohort 日新增玩家数
    n_days: [1, 3, 7]
  ads_online_duration_di:
    name: 日在线时长
    grain: day x server_id
    formula: SUM(session_duration_sec) / COUNT(DISTINCT player_id)；session 由 login→logout 配对
    unit: seconds
  ads_pay_rate_di:
    name: 付费率
    grain: day x server_id
    formula: COUNT(DISTINCT player_id WHERE event_type='recharge') / DAU
  ads_arpu_di:
    name: ARPU
    grain: day x server_id
    formula: SUM(recharge.amount_fen) / 100.0 / DAU
    unit: CNY
  ads_dungeon_clear_rate_di:
    name: 副本通关率
    grain: day x dungeon_id x server_id
    formula: COUNT(clear_dungeon) / COUNT(enter_dungeon)
  ads_churn_di:
    name: 流失风险日表
    grain: day x server_id
    formula: 过去7日有行为且过去3日无行为的玩家数 / 过去7日有行为玩家数
    window_active_days: 7
    window_silent_days: 3

datapilot_contract:
  metric_id_field: metric_id
  value_field: metric_value
  dims_allowed: [dt, server_id, dungeon_id, n_days, cohort_dt]
  sql_dir: sql/metrics/
