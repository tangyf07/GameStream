[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestream"
version = "0.1.0"
description = "Realtime analytics pipeline for game-player behavior: Kafka → Flink → Doris ADS, with DuckDB local path"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=0.10.0,<2.0",
  "pandas>=2.0.0,<3.0",
  "pyarrow>=14.0.0,<20.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]
spark = ["pyspark>=3.5.0"]
kafka = ["confluent-kafka>=2.3.0"]
materializer = ["kafka-python>=2.0.2,<3.1", "PyMySQL>=1.1.0,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pipeline*", "simulator*"]
