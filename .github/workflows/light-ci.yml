name: light-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-duckdb:
    name: pytest + DuckDB smoke
    runs-on: ubuntu-latest
    # Light CI only: pytest + local DuckDB. Do NOT start Flink/Doris/docker compose.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (dev + materializer extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,materializer]"

      - name: Run pytest (local DuckDB path)
        run: pytest -q
