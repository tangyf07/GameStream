DataPilot_baseline_p0 = 285202c
DataPilot_note = suite_p0 (pytest -m suite_p0); behavioral baseline includes 285202c P0

[paths.wsl]
path_GameStream = /mnt/c/Users/tangy/source/repos/GameStream
path_SQLGuard = /mnt/c/Users/tangy/source/repos/sql-write-gate
path_DataPilot = /mnt/c/Users/tangy/source/repos/DataPilot

[checks]
