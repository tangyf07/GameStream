[pins]
GameStream = 2253b25
GameStream_repo = https://github.com/tangyf07/GameStream
GameStream_note = base for suite-acceptance; landing commit will be newer on main

SQLGuard = 7dc85dd
SQLGuard_repo = https://github.com/tangyf07/sql-write-gate
SQLGuard_product = SQLGuard
SQLGuard_package = sql-write-gate
SQLGuard_version = 1.1.2
SQLGuard_note = v1.1.2; inherits 1.1.1 qualified identity (hive.ads_dau_di BLOCK)
SQLGuard_test = make test
SQLGuard_test_optional = pytest -q tests/test_v110.py
