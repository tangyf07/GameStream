GameStream_note = verification baseline after strict-gate + G8 wording honesty; HEAD may be newer (ancestor OK)

SQLGuard = 7dc85dd
SQLGuard_repo = https://github.com/tangyf07/SQLGuard
SQLGuard_product = SQLGuard
